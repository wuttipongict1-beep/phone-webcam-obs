<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Phone Webcam Studio</title><link rel="stylesheet" href="/style.css"></head><body class="dashboard">
<header class="dash-head"><div><div class="muted">PHONE WEBCAM • OBS</div><h1>Studio Control</h1></div><div class="room-box">ROOM <b id="roomLabel">STUDIO</b></div></header>
<div class="grid"><aside class="panel"><h3>กล้องออนไลน์</h3><div id="cameraList" class="camera-list"><div class="empty">กำลังค้นหากล้อง...</div></div><div class="pair"><div id="qrNote" class="muted small">กำลังตรวจสอบ HTTPS...</div><h3>Pair Camera</h3><img id="qr" alt="QR สำหรับเปิดกล้อง"><input id="roomInput" value="STUDIO"><button id="newRoom" class="button">ใช้ Room นี้</button><p id="qrUrl" class="muted small"></p>
<p class="muted small">สแกน QR จากมือถือ แล้วตั้งชื่อ CAM 01, CAM 02...</p>
<a class="cert-link" href="/cert.pem">ดาวน์โหลดใบรับรอง HTTPS สำหรับ LAN</a></div></aside>
<main class="viewer"><div class="viewer-top"><b id="selectedName">ยังไม่ได้เลือกกล้อง</b><span id="stats">—</span></div><video id="remoteVideo" autoplay playsinline></video></main></div>
<script src="/socket.io/socket.io.js"></script><script src="/studio.js"></script></body></html>
